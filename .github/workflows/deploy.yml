# Builds the data and the app, runs the checks, and deploys to GitHub Pages on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hadith sources are pinned to a commit in scripts/sources.ts, so the download is cached by that file.
      - uses: actions/cache@v4
        with:
          path: data-src/hadith
          key: hadith-${{ hashFiles('scripts/sources.ts') }}
      - run: npm run data:fetch
      - run: npm run build
      - run: npm run check
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
