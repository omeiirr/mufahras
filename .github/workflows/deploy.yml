# Builds the data and the app, runs the checks (types, unit and data tests, the search-by-meaning evaluation,
# browser tests), and deploys to GitHub Pages on every push to main. Nothing deploys if any check fails.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Hadith sources are pinned to a commit in scripts/sources.ts, so the download is cached by that file.
      - uses: actions/cache@v6
        with:
          path: data-src/hadith
          key: hadith-${{ hashFiles('scripts/sources.ts') }}
      # The search-by-meaning model (34 MB) is pinned to a revision and checksums in scripts/meaning.ts.
      - uses: actions/cache@v6
        with:
          path: data-src/model
          key: model-${{ hashFiles('scripts/meaning.ts') }}
      - run: npm run data:fetch
      - run: npm run build
      - run: npm run check
      - run: npm test

      # Browser tests against the built site: layout at phone and desktop sizes, interactions, offline use.
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install --with-deps chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      - run: npx playwright install-deps chromium
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
