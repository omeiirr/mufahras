<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#faf8f3" />
    <script>
      // Apply the saved theme before first paint (see src/lib/theme.svelte.ts).
      (function () {
        var bg = { paper: '#faf8f3', sepia: '#f1e7d0', dusk: '#262421', night: '#1f242c' };
        var t = 'auto';
        try {
          t = localStorage.getItem('theme') || 'auto';
        } catch (e) {}
        if (!bg[t]) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'night' : 'paper';
        document.documentElement.dataset.theme = t;
        document.querySelector('meta[name="theme-color"]').content = bg[t];
      })();
    </script>
    <meta name="description" content="Find any verse of the Quran or hadith of the six major collections as you type. Works offline." />
    <link rel="icon" type="image/png" href="icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <!-- Link previews (WhatsApp, Telegram, iMessage, X, Slack…). Scrapers need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mufahras" />
    <meta property="og:title" content="Mufahras · Quran & Hadith Search" />
    <meta property="og:description" content="Find any verse of the Quran or hadith of the six major collections as you type. Arabic, English or transliteration; works offline; private." />
    <meta property="og:url" content="https://omeiirr.github.io/mufahras/" />
    <meta property="og:image" content="https://omeiirr.github.io/mufahras/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mufahras logo, a golden meem in an eight-pointed star, with the tagline: Find any verse of the Quran or hadith as you type." />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Mufahras · Quran & Hadith Search</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
