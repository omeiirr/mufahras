<template>
  <style>
    @font-face { font-family: 'Amiri'; src: url('assets/fonts/amiri.woff2') format('woff2'); }
    #root { position: absolute; inset: 0; overflow: hidden; background: #faf8f3; font-family: 'Inter', sans-serif; }
    .ground { position: absolute; inset: 0; }
    .card { position: absolute; width: 824px; border-radius: 44px; overflow: hidden; background: #faf8f3;
      border: 1px solid #e4dfd3; box-shadow: 0 40px 90px rgba(31, 29, 26, 0.18); }
    .cam { position: absolute; inset: 0; }
    .fr { position: absolute; inset: 0; opacity: 0; }
    .shot { position: absolute; left: 0; background-repeat: no-repeat; background-size: 824px auto; }
    .fade { position: absolute; left: 0; width: 100%; height: 80px; background: linear-gradient(rgba(250, 248, 243, 0), #faf8f3); }
    .lift { position: absolute; border-radius: 22px; overflow: hidden; background: #faf8f3;
      box-shadow: 0 30px 70px rgba(31, 29, 26, 0.22); }
    .k { position: absolute; left: 120px; width: 840px; color: #1f1d1a; letter-spacing: -0.03em; }
    .k span, .w { display: inline-block; }

    #root { background: #faf8f3; }
    #wd-ex { opacity: 0; }
  </style>
  <div id="root" data-composition-id="word" data-width="1080" data-height="1920" data-layout-allow-overlap data-layout-allow-overflow>
    <div id="wd-card" class="card" style="left:128px;top:420px;height:760px;"><div id="wd-card-cam" class="cam"><div id="wd-v0" class="fr" style="opacity:1"><div class="shot" style="top:0px;width:824px;height:760px;background-image:url(assets/screens/verse-94-6.png);background-position:0px -80px"></div></div><div id="wd-v1" class="fr" style="opacity:1"><div class="shot" style="top:0px;width:824px;height:760px;background-image:url(assets/screens/verse-94-6-word.png);background-position:0px -80px"></div></div><div id="wd-v2" class="fr" style="opacity:1"><div class="shot" style="top:0px;width:824px;height:760px;background-image:url(assets/screens/verse-94-6-word-2.png);background-position:0px -80px"></div></div></div></div>
    <div id="wd-ex" class="lift" style="left:128px;top:1000px;width:824px;height:392px"><div class="shot" style="top:0px;width:824px;height:392px;background-image:url(assets/screens/verse-94-6-explain.png);background-position:0px -624px"></div></div>
  </div>
  <script>
    (() => {
      const tl = gsap.timeline({ paused: true });
      // One frame of the real app at a time: each appears as the previous one goes.
      const steps = (list) => list.forEach(([id, t], k) => {
        tl.set(id, { opacity: 1 }, t);
        if (k) tl.set(list[k - 1][0], { opacity: 0 }, t);
      });
      const blurIn = (sel, t, d = 0.2, stagger = 0, px = 8) => tl.fromTo(sel, { opacity: 0, filter: `blur(${px}px)` },
        { opacity: 1, filter: 'blur(0px)', duration: d, stagger, ease: 'power2.out' }, t);
      const blurOut = (sel, t, d = 0.2, stagger = 0) => tl.to(sel, { opacity: 0, filter: 'blur(8px)', duration: d, stagger, ease: 'power2.in' }, t);

      const W = 1080, H = 1920;
      // The khatam: the eight-pointed star of two squares, as in the app's icon.
      const NS = 'http://www.w3.org/2000/svg';
      const khatam = (cx, cy, r, rot = 0) => Array.from({ length: 16 }, (_, k) => {
        const a = ((rot - 90 + k * 22.5) * Math.PI) / 180, rr = k % 2 ? r * 0.7654 : r;
        return `${(cx + rr * Math.cos(a)).toFixed(1)},${(cy + rr * Math.sin(a)).toFixed(1)}`;
      }).join(' ');
      const diamond = (cx, cy, h) => `${cx},${cy - h} ${cx + h},${cy} ${cx},${cy + h} ${cx - h},${cy}`;
      const poly = (parent, points, attrs = {}) => {
        const p = document.createElementNS(NS, 'polygon');
        p.setAttribute('points', points);
        p.setAttribute('pathLength', 1);
        for (const [k, v] of Object.entries(attrs)) p.setAttribute(k, v);
        parent.appendChild(p);
        return p;
      };
      // An 8-fold tessellation: stars touching tip to tip, diamonds where four stars meet.
      // keep(x, y) decides which cells are drawn; each piece remembers its distance from (ox, oy).
      const tessellate = (parent, T, keep, ox, oy) => {
        const out = [], ni = Math.ceil(W / 2 / T) + 1, nj = Math.ceil(H / 2 / T) + 1;
        for (let j = -nj; j <= nj; j++) for (let i = -ni; i <= ni; i++) {
          const x = W / 2 + i * T, y = H / 2 + j * T;
          if (keep(x, y)) out.push(Object.assign(poly(parent, khatam(x, y, T / 2)), { d: Math.hypot(x - ox, y - oy), cx: x, cy: y }));
          const dx = x + T / 2, dy = y + T / 2;
          if (keep(dx, dy)) out.push(Object.assign(poly(parent, diamond(dx, dy, (T / 2) * (Math.SQRT2 - 1))), { d: Math.hypot(dx - ox, dy - oy), cx: dx, cy: dy }));
        }
        return out.sort((a, b) => a.d - b.d);
      };

      tl.fromTo('#wd-card', { scale: 1.1, filter: 'blur(12px)' }, { scale: 1, filter: 'blur(0px)', duration: 0.55, ease: 'expo.out' }, 0);
      // Push in on the Arabic line.
      tl.fromTo('#wd-card-cam', { scale: 1 }, { scale: 1.15, transformOrigin: '412.0px 307px', duration: 0.8, ease: 'power2.inOut' }, 0.3);
      // Each tap opens the word's meaning: the next screen irises out of the tapped word.
      tl.fromTo('#wd-v1', { clipPath: 'circle(0px at 473px 307px)' }, { clipPath: 'circle(900px at 473px 307px)', duration: 0.4, ease: 'power2.out' }, 1.06);
      tl.fromTo('#wd-v2', { clipPath: 'circle(0px at 594px 307px)' }, { clipPath: 'circle(900px at 594px 307px)', duration: 0.4, ease: 'power2.out' }, 1.86);
      // Its explanation slides in beside it.
      tl.to('#wd-card', { y: -260, duration: 0.55, ease: 'power2.inOut' }, 2.1);
      tl.fromTo('#wd-ex', { opacity: 0, y: 200, filter: 'blur(10px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 0.55, ease: 'expo.out' }, 2.25);
      tl.to('#root', { filter: 'brightness(0.6)', duration: 0.1 }, 3.05);
      window.__timelines['word'] = tl;
    })();
  </script>
